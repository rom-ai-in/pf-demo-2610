<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
<title>PhotoFlow — how it works</title>
<style>
body{margin:0;font-family:Inter,Helvetica Neue,Helvetica,Arial,sans-serif;background:#FAFAF8;color:#0B0B0C;line-height:1.5}
.banner{background:#0B0B0C;color:#fff;font-size:12px;padding:8px 16px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #e6e6e8}
.lang{display:flex;gap:4px}
.lang button{min-width:40px;min-height:36px;border:1px solid #e6e6e8;background:#fff;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#6b6b70}
.lang button[aria-pressed="true"]{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
main{width:min(720px,100%);margin:0 auto;padding:32px 20px 64px}
a{color:#c6322a}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 8px}
p{color:#5C5C63}
ol{padding-left:1.2rem}
li{margin:10px 0;color:#5C5C63}
li strong{color:#0B0B0C}
.note{font-size:13px;color:#5C5C63;border-left:3px solid #E6E6E8;padding-left:12px;margin-top:24px}
</style>
</head>
<body>
<div class="banner" data-i18n="banner"></div>
<div class="top">
  <a href="index.html" data-i18n="how_back"></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</div>
<main>
  <h1 data-i18n="how_title"></h1>
  <p data-i18n="how_intro"></p>
  <ol>
    <li data-i18n="how_1"></li>
    <li data-i18n="how_2"></li>
    <li data-i18n="how_3"></li>
    <li data-i18n="how_4"></li>
  </ol>
  <p class="note" data-i18n="how_note"></p>
</main>
<script>
const I18N = {"fr": {"banner": "Maquette conceptuelle — non affiliée à Alpha Foto — données d'exemple", "how_back": "← Retour", "how_title": "Comment fonctionne la recherche", "how_intro": "Version sobre du moteur — pour tous les événements Alphafoto. Adapté au sport (course, vélo, triathlon…).", "how_1": "Temps et lieu — à partir du chronométrage (quand un accord / API existe) et des points photo de l'événement, on estime une fenêtre de passage à chaque spot.", "how_2": "OCR du dossard — lecture automatique des numéros visibles sur les clichés, lorsqu'ils sont lisibles.", "how_3": "Tenue et description — couleurs et accessoires pour départager les candidats, surtout si le dossard est absent ou illisible (ex. certains sports d'hiver).", "how_4": "Visage — uniquement avec consentement explicite (données biométriques sensibles, nLPD). Désactivé par défaut.", "how_note": "Cette page décrit un concept. Aucun appel réel aux chronométreurs ni aux catalogues photo dans la maquette. Les images affichées sont des illustrations libres de droits.", "lang_label": "Langue"}, "de": {"banner": "Konzept-Mockup — nicht mit Alpha Foto verbunden — Beispieldaten", "how_back": "← Zurück", "how_title": "So funktioniert die Suche", "how_intro": "Nüchterne Version der Suche — für alle Alphafoto-Events. An den Sport angepasst (Laufen, Velo, Triathlon…).", "how_1": "Zeit und Ort — aus dem Timing (wenn Vereinbarung / API besteht) und den Fotopunkten des Events schätzen wir ein Zeitfenster an jedem Spot.", "how_2": "Startnummern-OCR — automatisches Lesen sichtbarer Nummern auf den Fotos, wenn lesbar.", "how_3": "Outfit und Beschreibung — Farben und Accessoires zur Unterscheidung, besonders wenn die Startnummer fehlt oder unleserlich ist (z. B. manche Wintersportarten).", "how_4": "Gesicht — nur mit ausdrücklicher Einwilligung (sensible biometrische Daten, nDSG). Standardmässig aus.", "how_note": "Diese Seite beschreibt ein Konzept. Kein echter Abruf bei Zeitnehmern oder Fotokatalogen in diesem Mockup. Die gezeigten Bilder sind lizenzfreie Illustrationen.", "lang_label": "Sprache"}, "en": {"banner": "Conceptual mockup — not affiliated with Alpha Foto — sample data", "how_back": "← Back", "how_title": "How the search works", "how_intro": "A sober search engine — for every Alphafoto event. Adapted to the sport (running, cycling, triathlon…).", "how_1": "Time and place — from timing (when an agreement / API exists) and the event's photo points, we estimate a passage window at each spot.", "how_2": "Bib OCR — automatic reading of visible numbers on shots, when readable.", "how_3": "Outfit and description — colours and accessories to separate candidates, especially if the bib is missing or unreadable (e.g. some winter sports).", "how_4": "Face — only with explicit consent (sensitive biometric data, nLPD). Off by default.", "how_note": "This page describes a concept. No real calls to timers or photo catalogues in the mockup. Images shown are royalty-free illustrations.", "lang_label": "Language"}};
let lang = localStorage.getItem('pf_lang_v32') || 'fr';
function apply(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(I18N[lang]&&I18N[lang][k]!=null) el.textContent=I18N[lang][k];
  });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang?'true':'false'));
  localStorage.setItem('pf_lang_v32', lang);
  document.title = (I18N[lang]&&I18N[lang].how_title) || 'How it works';
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; apply(); }));
apply();
</script>
</body>
</html>
