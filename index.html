<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="description" content="PhotoFlow — maquette conceptuelle indépendante (démo panier / TWINT)." />
<title>PhotoFlow — alphafoto.com (maquette v3.2.2)</title>
<link rel="icon" href="assets/brand/logo_alphafoto.png" />
<style>

:root{
  --ink:#1a1a1a;--muted:#6b6b70;--line:#e6e6e8;--bg:#f6f6f7;--card:#fff;
  --red:#c6322a;--ok:#1f7a45;--warn:#b86e00;--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.06);
  --tap:44px;--cart-h:0px;--font:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-bottom:var(--cart-h)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
a{color:var(--red)}
.app{min-height:100dvh;display:flex;flex-direction:column}
.banner{background:#111;color:#fff;text-align:center;font-size:12px;padding:7px 12px;letter-spacing:.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-height:var(--tap);background:none;border:0;padding:0;cursor:pointer;color:inherit;min-width:0}
.brand img{height:32px;width:auto;display:block}
.brand .tagline{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lang{display:flex;gap:4px}
.lang button{min-width:40px;min-height:var(--tap);border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cart-btn{position:relative;width:var(--tap);height:var(--tap);border:1px solid var(--line);border-radius:999px;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,transform .1s}
.cart-btn:hover{border-color:#bbb}
.cart-btn:active{transform:scale(.96)}
.cart-btn svg{width:22px;height:22px}
.cart-badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(198,50,42,.35)}
.cart-badge.show{display:inline-flex}
.cart-badge.pop{animation:badgePop .35s ease}
@keyframes badgePop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.progress{padding:8px 16px 0;background:#fff}
.progress-bar{height:3px;background:#ececee;border-radius:99px;overflow:hidden}
.progress-bar i{display:block;height:100%;width:6%;background:var(--red);border-radius:99px;transition:width .35s ease}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 0 8px}
main{flex:1;width:min(1100px,100%);margin:0 auto;padding:14px 16px calc(28px + var(--cart-h))}
.screen{display:none;animation:fade .22s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.hero img{width:100%;aspect-ratio:21/9;object-fit:cover;background:#222;display:block}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55))}
.hero .copy{position:absolute;left:18px;bottom:16px;right:18px;color:#fff}
.hero h1{margin:0 0 4px;font-size:clamp(1.35rem,3vw,1.85rem);letter-spacing:-.03em}
.hero p{margin:0;opacity:.92;font-size:15px}
h2{margin:0 0 6px;font-size:1.35rem;letter-spacing:-.02em}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.filters{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.hero img{aspect-ratio:16/10}}
@media(max-width:520px){.filters{grid-template-columns:1fr}.hero img{aspect-ratio:4/3}.brand .tagline{display:none}}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.textarea,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);min-height:var(--tap)}
.field input:focus,.field select:focus,textarea:focus{outline:2px solid rgba(198,50,42,.25);border-color:var(--red)}
.field.invalid input{border-color:var(--red)}
.field .err{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s,box-shadow .18s;min-height:var(--tap)}
.card:hover{transform:translateY(-2px);border-color:#d0d0d2;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.card:active{transform:translateY(0)}
.card .thumb{aspect-ratio:16/10;object-fit:cover;width:100%;background:#e8e8ea;display:block}
.card .body{padding:8px 10px 10px}
.card .tag{display:inline-flex;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--red);margin-bottom:4px}
.card h3{margin:0 0 2px;font-size:.9rem;letter-spacing:-.02em;font-weight:700;line-height:1.25}
.card .meta{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f0f0f2;color:var(--muted)}
.pill.ok{background:#e8f6ee;color:var(--ok)}
.pill.ex{background:#fdecea;color:var(--red)}
.pill.rec{background:#fff4e5;color:var(--warn)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}
.actions .right{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.btn{appearance:none;border:none;border-radius:999px;padding:12px 18px;min-height:var(--tap);font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s,opacity .15s;text-decoration:none;color:inherit}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover:not(:disabled){background:#b02b24}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-ghost:hover{border-color:#bbb}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;min-height:var(--tap);transition:border-color .15s,background .15s;width:100%}
.choice:hover{border-color:#ccc}
.choice .num{width:28px;height:28px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.choice b{display:block;margin-bottom:2px}
.choice span{color:var(--muted);font-size:13px}
.bib{font-family:var(--mono);font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:.08em;font-weight:700;background:var(--ink);color:#fff;display:inline-block;padding:8px 14px;border-radius:8px}
.note{color:var(--muted);font-size:12.5px}
.hidden{display:none!important}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
.found-banner{background:#e8f6ee;border:1px solid #b9e0c6;color:var(--ok);padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
.track{position:relative;padding:8px 0 4px}
.track-line{position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:#e0e0e3}
.points{display:grid;gap:10px}
.pt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.pt .pin{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #ccc;position:relative;z-index:1;flex-shrink:0;margin-left:2px}
.pt.you .pin{border-color:var(--red);background:#fdecea}
.pt-body{min-width:0;overflow:hidden}
.pt-name{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pt .win{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.pt .win-center{font-weight:700;color:var(--ink);white-space:nowrap}
.pt .win-range{white-space:nowrap;font-size:11.5px;letter-spacing:0.01em}
.times-table th,.times-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.times-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.neighbors{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.neighbor{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;background:#fff;min-height:var(--tap)}
.neighbor b{font-family:var(--mono)}
.swatches,.checks{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:var(--tap);height:var(--tap);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--red)}
.chip{border:1px solid var(--line);border-radius:999px;padding:10px 14px;min-height:var(--tap);background:#fff;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:12px}
.agent{text-align:center;padding:20px 8px}
.agent .counter{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:800;letter-spacing:-.04em;margin:8px 0}
.agent-steps{display:grid;gap:8px;text-align:left;max-width:420px;margin:16px auto 0}
.agent-steps .s{padding:11px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:8px;min-height:var(--tap);align-items:center;opacity:.55;transition:opacity .2s,border-color .2s}
.agent-steps .s.active{opacity:1;border-color:var(--red)}
.gallery-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:end;margin-bottom:10px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:8px}
@media(max-width:820px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.gallery{grid-template-columns:1fr}}
.photo{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
.photo.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(198,50,42,.2)}
.photo .ph{aspect-ratio:4/3;object-fit:cover;width:100%;background:#ececec;display:block}
@media(max-width:520px){.photo .ph{aspect-ratio:16/10;height:auto;max-height:min(42vh,260px)}.photo .info{padding:8px 10px 10px}.photo .why,.photo .illust{font-size:11px}}
.photo .info{padding:10px 12px 12px}
.photo .row{display:flex;justify-content:space-between;gap:6px;align-items:center}
.photo .why{font-size:12.5px;color:var(--muted);margin:4px 0}
.photo .illust{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#999;margin-bottom:8px}
.photo .btns{display:flex;flex-wrap:wrap;gap:6px}
.photo .btns button{flex:1 1 30%;min-height:var(--tap);border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.photo .btns button:hover{border-color:#bbb}
.photo .btns button:active{transform:scale(.98)}
.photo .btns button.yes[aria-pressed="true"]{background:#e8f6ee;border-color:#b9e0c6;color:var(--ok)}
.photo .btns button.no[aria-pressed="true"]{background:#f4f4f5;color:var(--muted)}
@media(max-width:420px){.photo .btns button{flex:1 1 0;min-width:0;font-size:11px;padding:8px 4px}}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.badge.hi{background:#e8f6ee;color:var(--ok)}
.badge.mid{background:#fff4e5;color:var(--warn)}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;z-index:35;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
@media(max-width:520px){.cartbar{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.cartbar .note{font-size:11px}.cartbar .btn{padding:10px 12px;font-size:13px}}
.cartbar.show{display:block}
.cartbar .inner{width:min(1100px,100%);margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cartbar .sum{font-weight:700}
.cartbar .sum .time{font-size:1.05rem}
.cart-line{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-line img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#eee}
.cart-line h4{margin:0 0 4px;font-size:14px}
.cart-line .meta{font-size:12px;color:var(--muted)}
.cart-line .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart-line .ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.cart-line select,.cart-line input[type=number]{min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.cart-line input[type=number]{width:64px}
.totals{display:grid;gap:8px;margin-top:14px}
.totals .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.totals .row.total{font-size:1.15rem;font-weight:800;padding-top:8px;border-top:1px solid var(--line)}
.pack-box{border:1px dashed #f0b4b0;background:#fff8f7;border-radius:12px;padding:12px;margin:12px 0}
.pack-box.suggest{border-style:solid;border-color:var(--red)}
.pay-opts{display:grid;gap:8px}
.pay-opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;min-height:var(--tap);transition:border-color .15s,background .15s;width:100%}
.pay-opt:hover{border-color:#ccc}
.pay-opt[aria-pressed=true]{border-color:var(--red);background:#fff8f7}
.pay-opt.twint{border-color:#111}
.pay-opt .mark{font-weight:800;letter-spacing:.04em;background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-size:13px}
.pay-opt .body{flex:1}
.pay-opt .body b{display:block}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.qr-box{position:relative;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-box canvas{display:block;width:220px;height:220px}
.qr-stamp{position:absolute;inset:auto 12px 18px 12px;text-align:center;background:rgba(255,255,255,.92);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);padding:4px}
.email-preview{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;white-space:pre-wrap;font-family:var(--mono)}
.done-box{text-align:center}
.done-box .big{font-size:2.4rem;color:var(--ok);margin-bottom:8px}
.conf-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
footer{text-align:center;padding:20px 16px 28px;color:var(--muted);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.toast{position:fixed;left:50%;bottom:calc(16px + var(--cart-h));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;visibility:hidden;display:none;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap}
.toast.show{display:block;opacity:1;visibility:visible;pointer-events:none;transform:translateX(-50%) translateY(0)}
.toast.force-hide{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:none!important}
@media(max-width:360px){main{padding-left:12px;padding-right:12px}.hero h1{font-size:1.3rem}.card h3{font-size:.9rem}.lang button{min-width:36px;font-size:11px}}

</style>
</head>
<body>

<div class="app">
  <div class="banner" data-i18n="banner"></div>
  <header class="top">
    <button type="button" class="brand" id="btnHome">
      <img src="assets/brand/logo_alphafoto.png" width="202" height="39" alt="Alphafoto" />
      <span class="tagline" data-i18n="brand_sub"></span>
    </button>
    <div class="top-right">
      <div class="lang" role="group" data-i18n-aria="lang_label">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="cart-btn" id="btnCartIcon" data-i18n-aria="cart_aria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.2" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>
  <div class="progress" id="progressWrap">
    <div class="progress-bar" aria-hidden="true"><i id="progressFill"></i></div>
    <div class="progress-meta"><span id="progressLabel"></span><span id="progressCount"></span></div>
  </div>
  <main>
    <section class="screen active" id="s-events">
      <div class="hero">
        <img src="assets/img/hero.jpg" alt="" width="1400" height="600" fetchpriority="high" />
        <div class="veil" aria-hidden="true"></div>
        <div class="copy">
          <h1 data-i18n="hero_title"></h1>
          <p data-i18n="hero_lead"></p>
        </div>
      </div>
      <h2 data-i18n="events_title"></h2>
      <p class="lead" data-i18n="events_lead"></p>
      <div class="filters">
        <div class="field"><label for="q" data-i18n="lbl_search"></label><input id="q" type="search" placeholder="Lausanne, Jungfrau, gravel…" autocomplete="off" /></div>
        <div class="field"><label for="sport" data-i18n="lbl_sport"></label>
          <select id="sport"><option value="all" data-i18n="sport_all"></option><option value="run">Running / Trail</option><option value="bike">Vélo / Gravel</option><option value="tri">Triathlon</option></select>
        </div>
        <div class="field"><label for="year" data-i18n="lbl_year"></label>
          <select id="year"><option value="2026">2026</option><option value="all" data-i18n="year_all"></option></select>
        </div>
        <div class="field"><label for="region" data-i18n="lbl_region"></label>
          <select id="region"><option value="all" data-i18n="region_all"></option><option value="vd">Vaud / Léman</option><option value="be">Bern / Mittelland</option><option value="vs">Valais / Alpes</option><option value="zh">Zürich / Ostschweiz</option></select>
        </div>
      </div>
      <div class="grid" id="eventGrid"></div>
      <div class="empty hidden" id="eventsEmpty" data-i18n="events_empty"></div>
    </section>

    <section class="screen" id="s-bib">
      <p class="pill" id="eventPill"></p>
      <h2 data-i18n="bib_title"></h2>
      <p class="lead" data-i18n="bib_lead"></p>
      <form class="panel" id="bibForm">
        <div class="field" style="margin-bottom:12px"><label for="race" data-i18n="lbl_race"></label><select id="race" required></select></div>
        <div class="field" id="bibField"><label for="bib" data-i18n="lbl_bib"></label>
          <input id="bib" inputmode="numeric" pattern="[0-9]{1,6}" maxlength="6" autocomplete="off" required />
          <div class="err" id="bibErr"></div>
        </div>
        <p class="note" id="bibHint"></p>
      </form>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-back data-i18n="back"></button>

function tr(key){

function hideToast(immediate){
  const el=document.getElementById('toast');
  if(!el) return;
  clearTimeout(toast._t); clearTimeout(toast._clear);
  el.classList.remove('show');
  if(immediate){
    el.classList.add('force-hide');
    el.textContent='';
    void el.offsetWidth;
    el.classList.remove('force-hide');
  } else {
    toast._clear=setTimeout(()=>{ el.textContent=''; }, 220);
  }
}
function toast(msg){
  const el=document.getElementById('toast');
  if(!el) return;
  clearTimeout(toast._t); clearTimeout(toast._clear);
  el.classList.remove('force-hide');
  el.textContent=msg;
  el.classList.add('show');
  toast._t=setTimeout(()=>hideToast(false),1400);
}
function trf(k, vars){
  let s=tr(k);
  Object.keys(vars||{}).forEach(key=>{ s=s.split('{'+key+'}').join(String(vars[key])); });
  return s;
}

function dec(n, digits=1){
  const s = Number(n).toFixed(digits);
  return lang==='en' ? s : s.replace('.', ',');
}
function fmtDist(km, approx){
  if(km==null) return '—';
  const body = (Math.abs(km-Math.round(km))<1e-9) ? String(Math.round(km)) : dec(km,1);
  return (approx?'~':'')+body+' km';
}
function fmtClock(raw){
  if(!raw) return '—';
  // raw may use comma decimals (FR/DE Datasport style)
  if(lang==='en') return String(raw).replace(',', '.');
  return String(raw).replace('.', ',');
}
function fmtNet(raw){ return fmtClock(raw); }
function raceLabel(keyOrName){
  if(!keyOrName) return '';
  if(String(keyOrName).startsWith('race_')) return tr(keyOrName);
  return tr(RACE_KEYS[keyOrName]||'') || keyOrName;
}
function pointLabel(p){
  if(!p) return tr('point_generic');
  if(p.labelKey) return tr(p.labelKey);
  return p.label || tr('point_generic');
}
function splitLabel(s){
  if(s.labelKey) return tr(s.labelKey);
  return s.label;
}
function formatWin(p){
  if(!p || (!p.lo && !p.t)) return '<span class="win-center">—</span>';
  if(p.lo && p.hi){
    const center = p.center ? ('≈ '+p.center) : '';
    const range = p.lo+'–'+p.hi;
    if(center) return `<span class="win-center">${center}</span><span class="win-range">${range}</span>`;
    return `<span class="win-range">${range}</span>`;
  }
  return `<span class="win-center">${p.t||'—'}</span>`;
}
function applyI18n(){

function loadCart(){

    if(raw){ const d=JSON.parse(raw); cart=Array.isArray(d.items)?d.items:[]; packOn=!!d.packOn; promoOk=!!d.promoOk; }
  }catch(e){ cart=[]; }
}

function cartCount(){ return cart.reduce((s,i)=>s+ (i.format==='print'?i.qty:1), 0); }
function linePrice(it){
  if(it.format==='print') return PRICE_PRINT * (it.qty||1);
  return PRICE_HD;
}
function subtotal(){
  if(packOn) return PACK_PRICE;
  return cart.reduce((s,i)=>s+linePrice(i),0);
}
function discount(){
  return promoOk ? subtotal()*0.10 : 0;
}
function total(){ return Math.max(0, subtotal()-discount()); }
function vatPart(){ return total() - total()/(1+VAT); }

function updateCartChrome(){

function photoLabel(n){
  if(lang==='de') return n===1?'Foto':'Fotos';
  if(lang==='en') return n===1?'photo':'photos';
  return n<=1?'photo':'photos';
}
function setCartPad(on){
  const bar=document.getElementById('cartbar');
  bar.classList.toggle('show', on);
  const apply=()=>{
    const h = on ? Math.ceil(bar.getBoundingClientRect().height||0) : 0;
    document.documentElement.style.setProperty('--cart-h', (h?h+8:0)+'px');
  };
  requestAnimationFrame(()=>requestAnimationFrame(apply));
  if(on && !window.__cartRO){
    window.addEventListener('resize', ()=>{ if(bar.classList.contains('show')) apply(); });
    if(typeof ResizeObserver!=='undefined'){
      window.__cartRO=new ResizeObserver(()=>{ if(bar.classList.contains('show')) apply(); });
      window.__cartRO.observe(bar);
    } else window.__cartRO=true;
  }

function renderEvents(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const sport=document.getElementById('sport').value;
  const year=document.getElementById('year').value;
  const region=document.getElementById('region').value;
  const grid=document.getElementById('eventGrid');
  grid.innerHTML='';
  const list=EVENTS.filter(e=>{
    if(sport!=='all' && e.sport!==sport) return false;
    if(region!=='all' && e.region!==region) return false;
    if(year!=='all' && e.date && !String(e.date).includes(year) && e.date!==year) return false;
    if(year!=='all' && !e.date && year && year!=='2026') return false;
    if(q && !e.name.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('eventsEmpty').classList.toggle('hidden', list.length>0);
  list.forEach(e=>{
    const btn=document.createElement('button');
    btn.type='button'; btn.className='card';

    grid.appendChild(btn);
  });

  document.getElementById('bibErr').textContent='';
  document.getElementById('bibField').classList.remove('invalid');
  go('bib');
}

document.getElementById('bibForm').addEventListener('submit', e=>{
  e.preventDefault();
  const bib=(document.getElementById('bib').value||'').trim();
  const field=document.getElementById('bibField');
  if(!/^\d{1,6}$/.test(bib)){
    field.classList.add('invalid');
    document.getElementById('bibErr').textContent=tr('bib_err');
    document.getElementById('bib').focus();
    return;
  }
  field.classList.remove('invalid');
  document.getElementById('bibErr').textContent='';
  document.getElementById('bibDisplay').textContent=bib;
  document.getElementById('bibFoundDisplay').textContent=bib;
  document.getElementById('nfEvent').textContent=(event?event.name:'')+' · '+document.getElementById('race').value;
  const found = !!(event && event.bibFound && (bib===event.demoBib || (event.example && bib)));
  bibFoundPath=found;
  if(found){
    document.getElementById('foundMeta').textContent=(event.name)+' · '+document.getElementById('race').value+' · '+tr('found_count');
    go('found');
  } else go('notfound');
});

function runAgent(){
  const steps= bibFoundPath ? [
    {lbl:tr('ag_s1f'), from:48, to:48},
    {lbl:tr('ag_s2f'), from:48, to:19},
    {lbl:tr('ag_s3f'), from:19, to:10}
  ] : [
    {lbl:tr('ag_s1'), from:4280, to:4280},
    {lbl:tr('ag_s2'), from:4280, to:186},
    {lbl:tr('ag_s3'), from:186, to:42},
    {lbl:tr('ag_s4'), from:42, to:11},
    {lbl:tr('ag_s5'), from:11, to:8}
  ];
  const box=document.getElementById('agentSteps');
  box.innerHTML=steps.map((s,i)=>`<div class="s" data-i="${i}"><span>${s.lbl}</span><span class="n">—</span></div>`).join('');
  let i=0; const counter=document.getElementById('agentCount');
  function runStep(){
    if(i>=steps.length){ setTimeout(()=>go('results'), 550); return; }
    const s=steps[i];
    [...box.children].forEach((el,idx)=>el.classList.toggle('active', idx===i));
    let v=s.from; counter.textContent=String(v); box.children[i].querySelector('.n').textContent=String(v);
    const frames=16; let f=0;
    const iv=setInterval(()=>{
      f++; v=Math.round(s.from+(s.to-s.from)*(f/frames));
      counter.textContent=String(v); box.children[i].querySelector('.n').textContent=String(v);
      if(f>=frames){ clearInterval(iv); i++; setTimeout(runStep, 220); }
    }, 32);
  }
  runStep();
}

function buildGallery(){
  const pts=(event&&event.points&&event.points.length)?event.points:[{id:'p1',label:tr('point_generic')}];
  const items=[]; let gi=0;
  for(const p of pts){
    for(let k=0;k<2 && gi<GALS.length;k++,gi++){
      const idx=items.length;
      const conf= idx%3===1 ? 'mid' : 'hi';
      items.push({
        id:'ph'+idx, point:p.id, pointLabel:pointLabel(p), src:GALS[gi], conf,
        why: conf==='hi' ? (tr('why_hi')+' '+pointLabel(p)+' · '+tr('why_hi2')) : (tr('why_mid')+' · '+pointLabel(p)),
        score:96-idx*6
      });
    }
  }
  items.sort((a,b)=>b.score-a.score);
  galleryItems=items;
  return items;
}

  }).join('') || `<p class="note">${tr('cart_pack_title')}</p>`;

  box.querySelectorAll('.cart-line').forEach(line=>{

    packSaveEl.textContent=`${tr('cart_pack_save')} ${chf(saveAmt)} · ${chf(PACK_PRICE)}`;

function drawFakeQR(canvas, seed){
  if(!canvas || typeof canvas.getContext!=='function') return;
  const ctx=canvas.getContext('2d');
  if(!ctx) return;
  const n=33, s=canvas.width/n;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  let x=seed|0;
  const rnd=()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return (x>>>0)/0xffffffff; };
  ctx.fillStyle='#111';
  function finder(ox,oy){
    for(let i=0;i<7;i++) for(let j=0;j<7;j++){
      const edge=i===0||i===6||j===0||j===6;
      const mid=i>=2&&i<=4&&j>=2&&j<=4;
      if(edge||mid) ctx.fillRect((ox+i)*s,(oy+j)*s,s,s);
    }
  }
  finder(1,1); finder(n-8,1); finder(1,n-8);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    if(i<8&&j<8) continue; if(i>n-9&&j<8) continue; if(i<8&&j>n-9) continue;
    if(rnd()>0.55) ctx.fillRect(i*s,j*s,Math.ceil(s),Math.ceil(s));
  }
  ctx.fillStyle='#c6322a';
  ctx.font='bold 14px sans-serif';
  ctx.fillText('DEMO', canvas.width/2-22, canvas.height/2+5);
}
